<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Five Ceramics QR</title>
  <meta name="robots" content="noindex, nofollow, noarchive">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f9f7f3;
    }

    .qr-panel {
      text-align: center;
      padding: 2rem;
    }

    .qr-panel img {
      width: min(70vw, 320px);
      height: auto;
      display: block;
      margin: 0 auto 1rem;
      background: #fff;
      padding: 0.75rem;
      border: 1px solid #dedad3;
    }
  </style>
</head>
<body>
  <main class="qr-panel">
    <img src="images/fiveceramics-qr.png" alt="QR code linking to fiveceramics.com">
    <p>Scan to visit Five Ceramics.</p>
  </main>
</body>
</html>
